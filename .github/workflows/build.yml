name: Build Android APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK and NDK
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "ndk;28.0.13004108"

      - name: Setup GraalVM JDK 21
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '21'
          distribution: 'graalvm-community'
          components: 'native-image'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Android Package
        run: mvn -e -B clean gluonfx:build gluonfx:package -Dgluonfx.target=android

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sari-store-pos-apk
          path: target/gluonfx/**/*.apk
          if-no-files-found: error